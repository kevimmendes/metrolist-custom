name: Build FOSS Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Dois ajustes em relação ao passo que quebrava:
      #  - o setup-android@v3 tenta instalar o pacote "tools" por padrão, que foi
      #    removido dos repositórios do SDK ("Failed to find package 'tools'").
      #  - API 37 não existe como "platforms;android-37"; o Android publica a
      #    versão menor "platforms;android-37.0" (compileSdk = 37 no AGP 9.4).
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0 build-tools;37.0.0'

      - name: Show installed platforms
        run: ls -la "${ANDROID_HOME}/platforms" || true

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Build Foss Debug APK
        run: ./gradlew :app:assembleFossDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrolist-foss-debug
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
