name: Build FOSS Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # O setup-android@v3 instala por padrão o pacote "tools", que foi removido
      # dos repositórios do SDK -> "Failed to find package 'tools'". Aqui passamos
      # explicitamente os pacotes que o build precisa (compileSdk 37).
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37 build-tools;37.0.0'

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Build Foss Debug APK
        run: ./gradlew :app:assembleFossDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrolist-foss-debug
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
